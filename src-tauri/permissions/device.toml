[[permission]]
identifier = "allow-device-get-battery"
description = "Allows reading battery level for device_get_battery."
commands.allow = ["device_get_battery"]

[[permission]]
identifier = "allow-device-get-location"
description = "Allows reading geolocation for device_get_location."
commands.allow = ["device_get_location"]

[[permission]]
identifier = "allow-save-download"
description = "Allows saving a file Ankur downloads from the app into the Downloads folder."
commands.allow = ["save_download"]
