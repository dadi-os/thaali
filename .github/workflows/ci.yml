name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: thaali-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - run: npm ci

      - run: npm test

      - run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build production image
        run: docker build --target production -t thaali-prod .

  publish:
    needs: container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/thaali:latest
            ghcr.io/${{ github.repository_owner }}/thaali:${{ github.sha }}

  release-desktop:
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            net_target: linux-amd64
            rust_targets: ""
            build_args: "--bundles appimage"
            installer_glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
            installer_name: thaali-linux-x86_64.AppImage
            updater_glob: "src-tauri/target/release/bundle/appimage/*.AppImage.sig"
            updater_name: thaali-linux-x86_64.AppImage.sig
            updater_bundle: ""
          - os: macos-latest
            net_target: darwin-arm64
            rust_targets: aarch64-apple-darwin
            build_args: "--bundles app,dmg --target aarch64-apple-darwin"
            installer_glob: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"
            installer_name: thaali-macos-aarch64.dmg
            updater_glob: "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"
            updater_name: thaali-macos-aarch64.app.tar.gz.sig
            updater_bundle: "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz"
            updater_bundle_name: thaali-macos-aarch64.app.tar.gz
          - os: windows-latest
            net_target: windows-amd64
            rust_targets: ""
            build_args: "--bundles nsis"
            installer_glob: "src-tauri/target/release/bundle/nsis/*setup.exe"
            installer_name: thaali-windows-x86_64-setup.exe
            updater_glob: "src-tauri/target/release/bundle/nsis/*setup.exe.sig"
            updater_name: thaali-windows-x86_64-setup.exe.sig
            updater_bundle: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets == ''

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust_targets != ''
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Install MinGW (Windows cross-tools for CI host)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install mingw -y --no-progress
          # Chocolatey layout varies by version; put every likely bin dir on PATH.
          for d in \
            /c/ProgramData/mingw64/mingw64/bin \
            /c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin \
            /c/tools/mingw64/bin
          do
            if [ -x "$d/gcc.exe" ] || [ -x "$d/gcc" ]; then
              echo "$d" >> "$GITHUB_PATH"
              echo "Using MinGW at $d"
            fi
          done
          gcc --version
          # Rust windows-gnu target uses this linker name.
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            gcc_path=$(command -v gcc)
            ln -sf "$gcc_path" "$(dirname "$gcc_path")/x86_64-w64-mingw32-gcc"
            ln -sf "$(dirname "$gcc_path")/g++" "$(dirname "$gcc_path")/x86_64-w64-mingw32-g++" || true
          fi
          x86_64-w64-mingw32-gcc --version

      - name: Stamp SemVer from run number
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.0.${{ github.run_number }}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');" "$VERSION"
          echo "Stamped version ${VERSION}"
          grep '^version' src-tauri/Cargo.toml
          node -p "require('./package.json').version"

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is required (see .env.github)."
            exit 1
          fi

      - name: Build system mesh binaries (macOS / Linux / Windows)
        shell: bash
        run: |
          set -euo pipefail
          cd net && ./build-tailscale.sh ${{ matrix.net_target }}
          if [ "${{ matrix.net_target }}" = "windows-amd64" ]; then
            test -f ../src-tauri/bin/windows-amd64/wintun.dll
            ls -la ../src-tauri/bin/windows-amd64
          fi

      - run: npm ci
        shell: bash

      - name: Build desktop installer
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_PRIVATE_KEY:-}" ] && [ -n "${APPLE_API_KEY:-}" ]; then
            export APPLE_API_KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            mkdir -p "$(dirname "$APPLE_API_KEY_PATH")"
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          fi
          unset APPLE_API_PRIVATE_KEY
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER \
                   APPLE_API_KEY_PATH TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              unset "$v"
            fi
          done
          npm run tauri build -- ${{ matrix.build_args }}

      # Vite writes the web build to dist/; do not glob that onto the GitHub
      # Release (index.html, favicons). Installers go in release-assets/.
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets updater-sigs
          src=$(ls ${{ matrix.installer_glob }} | head -1)
          cp "$src" "release-assets/${{ matrix.installer_name }}"
          sig=$(ls ${{ matrix.updater_glob }} | head -1)
          cp "$sig" "updater-sigs/${{ matrix.updater_name }}"
          if [ -n "${{ matrix.updater_bundle }}" ]; then
            bundle=$(ls ${{ matrix.updater_bundle }} | head -1)
            cp "$bundle" "release-assets/${{ matrix.updater_bundle_name }}"
          fi
          ls -la release-assets updater-sigs

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: thaali-${{ github.sha }}
          name: Thaali ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: release-assets/*

      - name: Share updater signatures
        uses: actions/upload-artifact@v7
        with:
          name: updater-sig-${{ matrix.os }}
          path: updater-sigs/*
          if-no-files-found: error

  release-updater-manifest:
    needs: release-desktop
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["success","failure"]'), needs.release-desktop.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download updater signatures
        uses: actions/download-artifact@v8
        with:
          pattern: updater-sig-*
          merge-multiple: true
          path: updater-sigs

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: thaali-${{ github.sha }}
          VERSION: 0.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          export BASE VERSION
          ls -la updater-sigs || true
          python3 <<'PY'
          import json, pathlib, os, sys
          base = os.environ["BASE"]
          version = os.environ["VERSION"]
          sigs = pathlib.Path("updater-sigs")
          catalog = {
              "linux-x86_64": (
                  f"{base}/thaali-linux-x86_64.AppImage",
                  "thaali-linux-x86_64.AppImage.sig",
              ),
              "darwin-aarch64": (
                  f"{base}/thaali-macos-aarch64.app.tar.gz",
                  "thaali-macos-aarch64.app.tar.gz.sig",
              ),
              "windows-x86_64": (
                  f"{base}/thaali-windows-x86_64-setup.exe",
                  "thaali-windows-x86_64-setup.exe.sig",
              ),
          }
          platforms = {}
          for key, (url, sig_name) in catalog.items():
              path = sigs / sig_name
              if not path.is_file():
                  print(f"omit {key}: missing {sig_name}", file=sys.stderr)
                  continue
              platforms[key] = {
                  "url": url,
                  "signature": path.read_text().strip(),
              }
          if not platforms:
              print("::error::No updater signatures found — cannot write latest.json", file=sys.stderr)
              sys.exit(1)
          manifest = {
              "version": version,
              "notes": f"dadi {version}",
              "platforms": platforms,
          }
          out = pathlib.Path("latest.json")
          out.write_text(json.dumps(manifest, indent=2) + "\n")
          print(out.read_text())
          PY
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
